apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: converter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/240107001-netize/inf345-project
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
